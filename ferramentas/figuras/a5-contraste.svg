  <rect class="traco" pathLength="1" style="--d:2.1s" x="655" y="120" width="210" height="70" rx="4"/>

  <text class="rt p" text-anchor="end"><tspan class="forte" x="160" y="50">Brito et al.</tspan><tspan x="160" y="72">(ódio)</tspan></text>
  <text class="rt p" text-anchor="end"><tspan class="forte" x="160" y="150">esta amostra</tspan><tspan x="160" y="172">(0/30)</tspan></text>

  <text class="rt p" text-anchor="middle"><tspan x="280" y="50">discurso de ódio</tspan><tspan x="280" y="72">ofensa na <tspan class="forte">palavra</tspan></tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="520" y="50">traduz e a carga</tspan><tspan x="520" y="72">se perde</tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="760" y="50">rótulo <tspan class="forte">muda</tspan></tspan><tspan x="760" y="72">descarta</tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="280" y="150">dano operacional</tspan><tspan x="280" y="172">ofensa no <tspan class="forte">ato</tspan></tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="520" y="150">código e ato</tspan><tspan x="520" y="172">sobrevivem</tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="760" y="150">rótulo <tspan class="forte">igual</tspan></tspan><tspan x="760" y="172">preserva</tspan></text>
