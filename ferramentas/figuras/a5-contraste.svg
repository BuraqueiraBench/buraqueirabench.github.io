  <rect class="ag nocivo" style="--d:.9s" x="655" y="20" width="210" height="70" rx="4"/>
  <rect class="ag en" style="--d:1.3s" x="175" y="120" width="210" height="70" rx="4"/>
  <rect class="ag en" style="--d:1.7s" x="415" y="120" width="210" height="70" rx="4"/>
  <rect class="ag en" style="--d:2.1s" x="655" y="120" width="210" height="70" rx="4"/>

  <rect class="traco nocivo" pathLength="1" style="--d:.1s" x="175" y="20" width="210" height="70" rx="4"/>
  <rect class="traco nocivo" pathLength="1" style="--d:.5s" x="415" y="20" width="210" height="70" rx="4"/>
  <rect class="traco nocivo" pathLength="1" style="--d:.9s" x="655" y="20" width="210" height="70" rx="4"/>
  <rect class="traco" pathLength="1" style="--d:1.3s" x="175" y="120" width="210" height="70" rx="4"/>
