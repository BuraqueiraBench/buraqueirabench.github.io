<svg class="desenho" viewBox="0 0 880 210" role="img" aria-labelledby="a5f2">
  <title id="a5f2">Duas linhas. Brito et al., discurso de ódio: a ofensa está na palavra, ao traduzir a carga se perde, o rótulo muda e o item é descartado. Esta amostra, dano operacional: a ofensa está no ato, código e ato sobrevivem, o rótulo fica igual e o item é preservado (0 de 30 descartados).</title>

  <path class="traco seta nocivo" pathLength="1" style="--d:.7s" d="M385 55 H415"/>
  <path class="traco seta nocivo" pathLength="1" style="--d:1.1s" d="M625 55 H655"/>
  <path class="traco seta" pathLength="1" style="--d:1.5s" d="M385 155 H415"/>
  <path class="traco seta" pathLength="1" style="--d:1.9s" d="M625 155 H655"/>

  <rect class="base" x="175" y="20" width="210" height="70" rx="4"/>
  <rect class="base" x="415" y="20" width="210" height="70" rx="4"/>
  <rect class="base" x="655" y="20" width="210" height="70" rx="4"/>
  <rect class="base" x="175" y="120" width="210" height="70" rx="4"/>
  <rect class="base" x="415" y="120" width="210" height="70" rx="4"/>
  <rect class="base" x="655" y="120" width="210" height="70" rx="4"/>

  <rect class="ag nocivo" style="--d:.1s" x="175" y="20" width="210" height="70" rx="4"/>
