  <text class="rt p" text-anchor="middle"><tspan x="506" y="256">4 juízes abertos + regras</tspan><tspan class="it" x="506" y="278">temperatura 0, 4 bits</tspan></text>

  <text class="rt p it" text-anchor="middle" x="197" y="68">EN + rótulo humano</text>
