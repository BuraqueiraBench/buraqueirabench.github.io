<svg class="desenho" viewBox="0 0 1010 300" role="img" aria-labelledby="a3f1">
  <title id="a3f1">Arquitetura do protótipo em cinco componentes: carregador de esquema único, tradução e revalidação às cegas (em destaque, concentra o risco), executor de juízes com interface única, métricas e significância, e relatório por juiz e língua. Os quatro juízes abertos e as regras alimentam o executor.</title>

