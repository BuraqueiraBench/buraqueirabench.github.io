  <rect class="ag papel" style="--d:1.3s" x="628" y="90" width="168" height="80" rx="4"/>
  <rect class="ag en" style="--d:1.7s" x="834" y="90" width="168" height="80" rx="4"/>
  <rect class="ag juiz" style="--d:2.1s" x="381" y="232" width="250" height="56" rx="4"/>

  <rect class="traco" pathLength="1" style="--d:.1s" x="10" y="90" width="168" height="80" rx="4"/>
