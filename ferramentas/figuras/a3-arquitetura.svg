  <text class="rt p" text-anchor="middle"><tspan x="94" y="125"><tspan class="forte">(1)</tspan> carregador</tspan><tspan x="94" y="147">esquema único</tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="300" y="114"><tspan class="forte">(2)</tspan> tradução e</tspan><tspan x="300" y="136">revalidação às cegas</tspan><tspan class="it" x="300" y="158">registra descarte</tspan></text>
  <text class="rt p" text-anchor="middle"><tspan x="506" y="114"><tspan class="forte">(3)</tspan> executor</tspan><tspan x="506" y="136">de juízes</tspan><tspan class="it" x="506" y="158">interface única</tspan></text>
